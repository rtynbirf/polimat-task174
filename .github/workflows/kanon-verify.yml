name: kanon-verify (канон проверок)

# Волна ×4 · П45 (issue #2): верификатор канона как библиотека.
# Приёмка из issue: pip install -e . && kanon-verify --selftest rc=0;
# юнит-тесты зелёные; hub-инвентарь импортирует пакет.

on:
  push:
    paths:
      - "verifier/**"
      - "scripts/hub_inventory.py"
      - "MANIFEST_SHA256.txt"
      - ".github/workflows/kanon-verify.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Установка пакета (pip install -e ./verifier)
        run: python -m pip install -e ./verifier
      - name: Самоиспытание канона (kanon-verify --selftest, rc=0)
        run: kanon-verify --selftest
      - name: Юнит-приёмки канона
        run: python -m unittest discover -s verifier/tests -v
      - name: Hub-инвентарь импортирует пакет (384 пломбы)
        run: python3 scripts/hub_inventory.py
